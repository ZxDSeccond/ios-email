name: Build iOS App IPA

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Create Xcode Project Structure
      run: |
        cat << 'EOT' > Package.swift
        // swift-tools-version: 5.9
        import PackageDescription

        let package = Package(
            name: "DeviceSpoofer",
            platforms: [.iOS(.v16)],
            products: [
                .library(name: "DeviceSpoofer", targets: ["DeviceSpoofer"])
            ],
            targets: [
                .target(name: "DeviceSpoofer", path: "Sources")
            ]
        )
        EOT

    - name: Build Swift Package for iOS
      run: |
        swift build -Xswiftc "-sdk" -Xswiftc "$(xcrun --sdk iphoneos --show-sdk-path)" -Xswiftc "-target" -Xswiftc "arm64-apple-ios16.0"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ios-spoofer-artifact
        path: .build/
