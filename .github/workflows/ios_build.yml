name: Build IPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build and Package IPA
      run: |
        mkdir -p Payload/DeviceSpoofer.app
        swiftc -target arm64-apple-ios16.0 \
               -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -framework SwiftUI \
               -framework WebKit \
               -framework Foundation \
               -framework UIKit \
               -framework CoreGraphics \
               -parse-as-library \
               Sources/*.swift \
               -o Payload/DeviceSpoofer.app/DeviceSpoofer

        cat << 'EOT' > Payload/DeviceSpoofer.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.zxdi.devicespoofer</string>
            <key>CFBundleName</key>
            <string>DeviceSpoofer</string>
            <key>CFBundleExecutable</key>
            <string>DeviceSpoofer</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
        </dict>
        </plist>
        EOT

        zip -r DeviceSpoofer.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: DeviceSpoofer-KSign
        path: DeviceSpoofer.ipa
